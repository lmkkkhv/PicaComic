name: Build Android Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
      - name: Verify keystore
        run: keytool -list -keystore android/app/keystore.jks -storepass '${{ secrets.KEYSTORE_PASSWORD }}'
      - name: Write key properties
        run: printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' '${{ secrets.KEYSTORE_PASSWORD }}' '${{ secrets.KEY_PASSWORD }}' '${{ secrets.KEY_ALIAS }}' > android/key.properties
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.2.11-fix1
          name: v4.2.11-fix1
          body: "PicaComic 4.2.11 fork build with bug fixes: nhentai login, startup crash, image loading, htcomic 403 and detail parsing, EH download order, JM domain refresh, nhentai download stall. Signed with this fork's own key: uninstall the official build before installing."
          files: build/app/outputs/flutter-apk/*.apk
